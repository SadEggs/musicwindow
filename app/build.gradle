plugins {
    id 'com.android.application'
}

// A single, fixed signing identity for every build. It is generated once by CI
// and committed as base64 text (app/keystore.b64); the build workflow decodes it
// to app/release.keystore before Gradle runs.
//
// Why this matters: CI runners are brand new machines, so the "debug" key was
// regenerated on every run. Each APK therefore had a different certificate and
// Android refused to install a new version over the old one ("signatures do not
// match"), forcing an uninstall every time. One shared key fixes that.
def hasFixedKey = file('release.keystore').exists()

android {
    namespace 'com.musicbar.overlay'
    compileSdk 35

    defaultConfig {
        applicationId 'com.musicbar.overlay'
        minSdk 26
        targetSdk 35
        versionCode 30
        versionName '0.29'
    }

    // The resources and the README are full of Chinese; make sure the sources are always
    // read as UTF-8 rather than whatever the build machine happens to default to.
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    signingConfigs {
        if (hasFixedKey) {
            fixed {
                storeFile file('release.keystore')
                storePassword 'musicbar123'
                keyAlias 'musicbar'
                keyPassword 'musicbar123'
            }
        }
    }

    buildTypes {
        debug {
            // Sideload-friendly: debug builds are auto-signed with the debug keystore.
        }
        release {
            minifyEnabled false
            // The fixed key when present, otherwise fall back to the debug key so a
            // local build still works.
            signingConfig hasFixedKey ? signingConfigs.fixed : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        encoding 'UTF-8'
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// No AndroidX, no third-party libraries: framework APIs only.
dependencies {
}
