name: Build APK

# Three ways to get an APK:
#   1. Actions tab -> "Build APK" -> Run workflow  (manual)
#   2. Push to main/master
#   3. Push a tag like v1.0  -> also creates a Release with the APK attached
on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Self-contained Android SDK setup.
      # Deliberately does NOT use android-actions/setup-android: it tries to install
      # the retired "tools" package and dies with "Failed to find package 'tools'".
      - name: Install Android SDK
        run: |
          set -e
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          echo "Downloading Android cmdline-tools..."
          curl -sSL --retry 3 --retry-delay 5 -o /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"

          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          export ANDROID_SDK_ROOT="$SDK"
          export PATH="$SDK/cmdline-tools/latest/bin:$PATH"

          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

          echo "=== platforms ==="
          ls "$SDK/platforms"
          echo "=== build-tools ==="
          ls "$SDK/build-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Point Gradle at the SDK
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      # TEMPORARY PROBE: ask the real android.jar which shuffle / repeat members the
      # public media-session API actually publishes, instead of guessing. Removed once
      # the answer is known.
      - name: Probe media session shuffle API (temporary)
        run: |
          JAR="$ANDROID_SDK_ROOT/platforms/android-35/android.jar"
          echo "=== jar: $JAR ==="
          for CLS in android.media.session.PlaybackState android.media.session.MediaController 'android.media.session.MediaController$TransportControls' android.media.session.MediaSession; do
            echo "--- $CLS ---"
            javap -constants -classpath "$JAR" "$CLS" 2>&1 | grep -i -E "shuffle|repeat" || echo "  (nothing)"
          done
          echo "=== end probe ==="

      # One signing identity for every build, created once and then reused, so a
      # newer APK installs straight over the previous one. Before this, each run
      # generated a fresh throwaway debug key and Android rejected the update with
      # "signatures do not match", forcing an uninstall each time.
      # The key lives in the repo as base64 text (app/keystore.b64).
      - name: Ensure the fixed signing key
        run: |
          set -e
          if [ -f app/keystore.b64 ]; then
            echo "Reusing the committed signing key."
          else
            echo "No signing key yet: generating one and committing it."
            keytool -genkeypair \
              -keystore app/release.keystore \
              -alias musicbar \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -storepass musicbar123 -keypass musicbar123 \
              -dname "CN=MusicBar, O=SadEggs, C=CN"
            base64 -w0 app/release.keystore > app/keystore.b64
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f app/keystore.b64
            git commit -q -m "chore: commit the fixed signing key so updates install in place [skip ci]"
            git push
          fi
          base64 -d app/keystore.b64 > app/release.keystore
          echo "Keystore ready: $(ls -l app/release.keystore | awk '{print $5}') bytes"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Show the signing certificate
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --print-certs "$APK" \
            | grep -Ei 'Signer #1 certificate (DN|SHA-256)' || true

      - name: Show what was produced
        run: find app/build/outputs -name '*.apk' -exec ls -lh {} \;

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FloatingMusicBar-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: FloatingMusicBar-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Attach APKs to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # Tags such as v0.5-beta1 are published as pre-releases, so the stable
          # release keeps the "Latest" badge on the repo page.
          prerelease: ${{ contains(github.ref, 'beta') }}
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
